# docker-compose.yml – McpRAG production stack
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   backend  – FastAPI application (uses Gemini API for LLM)
#   frontend – React/Vite SPA served via nginx (public entrypoint on port 80)
#
# Usage:
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcprag_backend
    restart: unless-stopped
    # Port 8000 is NOT published to the host; only nginx proxies to it.
    expose:
      - "8000"
    env_file:
      # Values from your .env are injected at runtime; the file is never
      # copied into the image (see .dockerignore).
      - .env
    volumes:
      # Persist uploaded files and the FAISS/BM25 vector DB across restarts
      - uploads_data:/app/uploads
      - vector_db_data:/app/vector_db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - mcprag_net

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_BASE_URL is intentionally empty so the browser uses the
        # same origin (nginx handles proxying to the backend).
        VITE_API_BASE_URL: ""
    container_name: mcprag_frontend
    restart: unless-stopped
    ports:
      # Publicly accessible on port 80
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - mcprag_net

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local
  vector_db_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  mcprag_net:
    driver: bridge

